<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Ambience Orbs (Kept in Background) -->
  <g opacity="0.35">
    <circle cx="150" cy="80" r="140" fill="#38bdf8">
      <animate attributeName="cx" values="150;200;150" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.45;0.25" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="280" r="160" fill="#818cf8">
      <animate attributeName="cy" values="280;220;280" dur="12s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="90" r="100" fill="#c084fc">
      <animate attributeName="r" values="100;130;100" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Subtle Network / Cloud Topology Lines (Background Graphic) -->
  <g stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.6">
    <path d="M 820 180 Q 950 110 1080 180 T 1150 250">
      <animate attributeName="stroke-dashoffset" values="0;40" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M 850 240 Q 980 300 1110 230">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Network Nodes with Pulse Animation -->
  <g>
    <circle cx="820" cy="180" r="6" fill="#38bdf8" />
    <circle cx="820" cy="180" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="6;22;6" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite" />
    </circle>

    <circle cx="980" cy="140" r="7" fill="#818cf8" />
    <circle cx="980" cy="140" r="16" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="7;26;7" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3.5s" repeatCount="indefinite" />
    </circle>

    <circle cx="1080" cy="180" r="6" fill="#c084fc" />
    <circle cx="1110" cy="230" r="5" fill="#38bdf8" />
  </g>

  <!-- Top Category Tag -->
  <g transform="translate(80, 48)">
    <rect width="260" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" class="badge-label">ENTERPRISE IT &amp; CLOUD OPS</text>
  </g>

  <!-- Primary Header & Subtitle (High contrast foreground) -->
  <g transform="translate(80, 130)">
    <text x="0" y="0" class="title-text" fill="url(#textGrad)">Awesome Enterprise IT &amp; Cloud Management</text>
    <text x="0" y="38" class="subtitle-text">Curated Multi-Cloud Orchestration, FinOps Governance &amp; Infrastructure Observability</text>
  </g>

  <!-- Feature Pills / Dynamic Capability Chips -->
  <g transform="translate(80, 225)">
    <!-- Pill 1: Multi-Cloud Orchestration -->
    <g transform="translate(0, 0)">
      <rect width="210" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#38bdf8" />
      <text x="36" y="26" class="pill-text">Multi-Cloud Orchestration</text>
    </g>

    <!-- Pill 2: FinOps & Cost Optimization -->
    <g transform="translate(225, 0)">
      <rect width="215" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#10b981" />
      <text x="36" y="26" class="pill-text">FinOps &amp; Cost Intelligence</text>
    </g>

    <!-- Pill 3: Hybrid Cloud Governance -->
    <g transform="translate(455, 0)">
      <rect width="210" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#818cf8" />
      <text x="36" y="26" class="pill-text">Hybrid Cloud Governance</text>
    </g>

    <!-- Pill 4: Open-Source First -->
    <g transform="translate(680, 0)">
      <rect width="185" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#f59e0b" />
      <text x="36" y="26" class="pill-text">Open-Source Platforms</text>
    </g>
  </g>

  <!-- Bottom Accent Progress Line with Glow -->
  <g transform="translate(80, 310)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#1e293b" stroke-width="2" />
    <line x1="0" y1="0" x2="360" y2="0" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="x1" values="0;680;0" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="360;1040;360" dur="8s" repeatCount="indefinite" />
    </line>
  </g>
</svg>
